name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke test compiled CLI
        shell: bash
        env:
          GIT2JIRA_CONFIG_DIR: ${{ runner.temp }}/git2jira-config
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-home
        run: |
          node dist/cli.js --version
          node dist/cli.js --help
          node dist/cli.js config get report.language
          node dist/cli.js skill install
          node dist/cli.js skill verify
      - name: Install the npm tarball outside the repository and run it
        run: pnpm test:package
